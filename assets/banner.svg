<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Daniel Serrano, desarrollador full-stack y fundador de Dann Studio">
  <defs>
    <style>
      .f { font-family: Geist, Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .m { font-family: 'Geist Mono', 'JetBrains Mono', 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace; }
      .caret { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      .orb1 { animation: drift1 14s ease-in-out infinite alternate; }
      .orb2 { animation: drift2 18s ease-in-out infinite alternate; }
      @keyframes drift1 { to { transform: translate(90px, 40px) } }
      @keyframes drift2 { to { transform: translate(-120px, -30px) } }
      .scan { animation: scan 6s linear infinite; }
      @keyframes scan { from { transform: translateX(-400px) } to { transform: translateX(1300px) } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 958px 74px; }
      @keyframes pulse { 50% { opacity: .35 } }
    </style>
    <clipPath id="card"><rect width="1200" height="420" rx="22"/></clipPath>
    <radialGradient id="o1"><stop offset="0" stop-color="#2266ff" stop-opacity=".55"/><stop offset="1" stop-color="#2266ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="o2"><stop offset="0" stop-color="#0a2bd0" stop-opacity=".5"/><stop offset="1" stop-color="#0a2bd0" stop-opacity="0"/></radialGradient>
    <radialGradient id="o3"><stop offset="0" stop-color="#22c55e" stop-opacity=".18"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2266ff"/>
      <stop offset=".35" stop-color="#5b93ff"/>
      <stop offset=".5" stop-color="#c9d8ff"/>
      <stop offset=".65" stop-color="#5b93ff"/>
      <stop offset="1" stop-color="#2266ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#2266ff" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b93ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#9db9ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#5b93ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <linearGradient id="fadegrid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gm"><rect width="1200" height="420" fill="url(#fadegrid)"/></mask>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="420" fill="#08080a"/>
    <rect width="1200" height="420" fill="url(#grid)" mask="url(#gm)"/>
    <circle class="orb1" cx="860" cy="120" r="330" fill="url(#o1)"/>
    <circle class="orb2" cx="1080" cy="380" r="300" fill="url(#o2)"/>
    <circle cx="160" cy="430" r="260" fill="url(#o3)"/>
    <rect class="scan" x="0" y="0" width="260" height="1" fill="url(#beam)"/>
    <rect class="scan" x="0" y="419" width="260" height="1" fill="url(#beam)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="419" rx="22" fill="none" stroke="url(#edge)"/>

  <!-- Marca -->
  <g >
    <g transform="translate(64 62)">
      <rect width="34" height="34" rx="9" fill="#2266ff"/>
      <path d="M10 9h7.5c5 0 8.5 3.4 8.5 8s-3.5 8-8.5 8H10z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <text x="112" y="85" class="f" font-size="15" font-weight="700" letter-spacing="4.2" fill="#f5f5f7">DANN STUDIO</text>
  </g>

  <!-- Nombre y frase -->
  <text x="62" y="178" class="f" font-size="68" font-weight="800" letter-spacing="-2" fill="#ffffff">Daniel Serrano</text>
  <text x="64" y="226" class="f" font-size="30" font-weight="700" letter-spacing="-.6" fill="url(#shine)">Software a la medida de tu operación.</text>
  <text x="65" y="268" class="f" font-size="17" fill="#f5f5f7" fill-opacity=".62">Desarrollador full-stack · Fundador de Dann Studio · Guadalajara, México</text>

  <!-- Chips -->
  <g class="f" font-size="14" font-weight="600">
    <g transform="translate(64 304)">
      <rect width="150" height="36" rx="18" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".12"/>
      <circle cx="20" cy="18" r="4" fill="#5b93ff"/><text x="32" y="23" fill="#f5f5f7">Plataformas web</text>
    </g>
    <g transform="translate(226 304)">
      <rect width="138" height="36" rx="18" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".12"/>
      <circle cx="20" cy="18" r="4" fill="#22c55e"/><text x="32" y="23" fill="#f5f5f7">Apps móviles</text>
    </g>
    <g transform="translate(376 304)">
      <rect width="188" height="36" rx="18" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".12"/>
      <circle cx="20" cy="18" r="4" fill="#a78bfa"/><text x="32" y="23" fill="#f5f5f7">Automatización con IA</text>
    </g>
    <g transform="translate(576 304)">
      <rect width="128" height="36" rx="18" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".12"/>
      <circle cx="20" cy="18" r="4" fill="#ffc93c"/><text x="32" y="23" fill="#f5f5f7">Videojuegos</text>
    </g>
  </g>

  <!-- Ventana de código -->
  <g  transform="translate(770 62)">
    <rect width="370" height="296" rx="16" fill="#0e0f14" fill-opacity=".92" stroke="#ffffff" stroke-opacity=".1"/>
    <rect width="370" height="40" rx="16" fill="#ffffff" fill-opacity=".03"/>
    <circle cx="22" cy="20" r="5.5" fill="#ff5f57"/><circle cx="40" cy="20" r="5.5" fill="#febc2e"/><circle cx="58" cy="20" r="5.5" fill="#28c840"/>
    <text x="185" y="25" text-anchor="middle" class="m" font-size="12" fill="#f5f5f7" fill-opacity=".45">dann.ts</text>
    <g class="m" font-size="14.5">
      <text x="24" y="78"><tspan fill="#c792ea">const</tspan><tspan fill="#f5f5f7"> dev = {</tspan></text>
      <text x="44" y="106"><tspan fill="#9db9ff">nombre</tspan><tspan fill="#f5f5f7">: </tspan><tspan fill="#a5e075">'Daniel Serrano'</tspan><tspan fill="#f5f5f7">,</tspan></text>
      <text x="44" y="134"><tspan fill="#9db9ff">estudio</tspan><tspan fill="#f5f5f7">: </tspan><tspan fill="#a5e075">'Dann Studio'</tspan><tspan fill="#f5f5f7">,</tspan></text>
      <text x="44" y="162"><tspan fill="#9db9ff">backend</tspan><tspan fill="#f5f5f7">: [</tspan><tspan fill="#a5e075">'NestJS'</tspan><tspan fill="#f5f5f7">, </tspan><tspan fill="#a5e075">'MongoDB'</tspan><tspan fill="#f5f5f7">],</tspan></text>
      <text x="44" y="190"><tspan fill="#9db9ff">frontend</tspan><tspan fill="#f5f5f7">: [</tspan><tspan fill="#a5e075">'Angular'</tspan><tspan fill="#f5f5f7">, </tspan><tspan fill="#a5e075">'TS'</tspan><tspan fill="#f5f5f7">],</tspan></text>
      <text x="44" y="218"><tspan fill="#9db9ff">extra</tspan><tspan fill="#f5f5f7">: [</tspan><tspan fill="#a5e075">'IA'</tspan><tspan fill="#f5f5f7">, </tspan><tspan fill="#a5e075">'Godot'</tspan><tspan fill="#f5f5f7">],</tspan></text>
      <text x="24" y="246"><tspan fill="#f5f5f7">};</tspan></text>
      <text x="24" y="274"><tspan fill="#5c6370">// </tspan><tspan fill="#5c6370">abierto a proyectos</tspan></text>
    </g>
    <rect class="caret" x="226" y="261" width="9" height="17" rx="1.5" fill="#5b93ff"/>
  </g>
</svg>
