<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Cómo trabajo: cuatro etapas">
<style>.f{font-family:Geist, Inter, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif}.m{font-family:'Geist Mono', 'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace}</style>
<defs><linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#2266ff"/><stop offset="1" stop-color="#22c55e"/></linearGradient></defs>
<rect x="60" y="40" width="1080" height="2" rx="1" fill="url(#l)" fill-opacity=".5"/>
<circle r="6" cy="41" fill="#9db9ff"><animate attributeName="cx" values="60;1140" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="6s" repeatCount="indefinite"/></circle>
<g transform="translate(0 0)"><circle cx="60" cy="41" r="15" fill="#08080a" stroke="#5b93ff" stroke-width="2"/><text x="60" y="46" text-anchor="middle" class="m" font-size="13" font-weight="700" fill="#9db9ff">01</text><rect y="78" width="285" height="160" rx="16" fill="#0e0f14" stroke="#fff" stroke-opacity=".09"/><text x="22" y="116" class="f" font-size="19" font-weight="800" fill="#ffffff">Entender la operación</text><text x="22" y="144" class="f" font-size="14.5" fill="#f5f5f7" fill-opacity=".6">Quién hace qué y dónde se traba.</text><text x="22" y="196" class="m" font-size="11" letter-spacing="1.5" fill="#22c55e">RECIBES</text><text x="22" y="220" class="f" font-size="15" font-weight="600" fill="#f5f5f7">Documento de alcance</text></g>
<g transform="translate(305 0)"><circle cx="60" cy="41" r="15" fill="#08080a" stroke="#5b93ff" stroke-width="2"/><text x="60" y="46" text-anchor="middle" class="m" font-size="13" font-weight="700" fill="#9db9ff">02</text><rect y="78" width="285" height="160" rx="16" fill="#0e0f14" stroke="#fff" stroke-opacity=".09"/><text x="22" y="116" class="f" font-size="19" font-weight="800" fill="#ffffff">Primera versión usable</text><text x="22" y="144" class="f" font-size="14.5" fill="#f5f5f7" fill-opacity=".6">Algo que ya se puede tocar.</text><text x="22" y="196" class="m" font-size="11" letter-spacing="1.5" fill="#22c55e">RECIBES</text><text x="22" y="220" class="f" font-size="15" font-weight="600" fill="#f5f5f7">Demo funcionando</text></g>
<g transform="translate(610 0)"><circle cx="60" cy="41" r="15" fill="#08080a" stroke="#5b93ff" stroke-width="2"/><text x="60" y="46" text-anchor="middle" class="m" font-size="13" font-weight="700" fill="#9db9ff">03</text><rect y="78" width="285" height="160" rx="16" fill="#0e0f14" stroke="#fff" stroke-opacity=".09"/><text x="22" y="116" class="f" font-size="19" font-weight="800" fill="#ffffff">Construcción</text><text x="22" y="144" class="f" font-size="14.5" fill="#f5f5f7" fill-opacity=".6">Por entregas que puedes revisar.</text><text x="22" y="196" class="m" font-size="11" letter-spacing="1.5" fill="#22c55e">RECIBES</text><text x="22" y="220" class="f" font-size="15" font-weight="600" fill="#f5f5f7">Avances visibles</text></g>
<g transform="translate(915 0)"><circle cx="60" cy="41" r="15" fill="#08080a" stroke="#5b93ff" stroke-width="2"/><text x="60" y="46" text-anchor="middle" class="m" font-size="13" font-weight="700" fill="#9db9ff">04</text><rect y="78" width="285" height="160" rx="16" fill="#0e0f14" stroke="#fff" stroke-opacity=".09"/><text x="22" y="116" class="f" font-size="19" font-weight="800" fill="#ffffff">Producción y soporte</text><text x="22" y="144" class="f" font-size="14.5" fill="#f5f5f7" fill-opacity=".6">En tu servidor o en la nube.</text><text x="22" y="196" class="m" font-size="11" letter-spacing="1.5" fill="#22c55e">RECIBES</text><text x="22" y="220" class="f" font-size="15" font-weight="600" fill="#f5f5f7">Sistema en uso</text></g>
</svg>
